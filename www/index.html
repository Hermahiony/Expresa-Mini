<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Se permite el zoom (accesibilidad). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a7fb5" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; base-uri 'none'; form-action 'none'" />
  <title>ExpresaMini</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true"><img src="assets/logo.png" alt="" /><div class="loader"><span></span></div></div>

  <div id="app" class="app">
    <header class="top">
      <button id="brand" class="brand" type="button" aria-label="Cambiar nombre">
        <img src="assets/logo.png" alt="" /><span id="greeting">Hola</span>
      </button>
      <span class="stars" aria-label="Estrellas ganadas">⭐ <b id="stars-count">0</b></span>
    </header>

    <section class="compose" aria-label="Tu mensaje">
      <div id="msg" class="msg" role="region" aria-live="polite" aria-label="Mensaje armado"></div>
      <div class="actions">
        <button id="btn-speak" class="speak" type="button"><span aria-hidden="true">🔊</span> HABLAR</button>
        <div class="mini-actions">
          <button id="btn-back" class="mini" type="button" aria-label="Borrar último símbolo">⌫</button>
          <button id="btn-clear" class="mini" type="button" aria-label="Limpiar mensaje">✕</button>
          <button id="btn-fav" class="mini" type="button" aria-label="Guardar como favorita">☆</button>
          <button id="btn-show" class="mini" type="button" aria-label="Mostrar mensaje en pantalla grande">🖥️</button>
        </div>
      </div>
      <div id="suggest" class="suggest" aria-label="Sugerencias"></div>
    </section>

    <div id="quick" class="quick" role="group" aria-label="Mensajes rápidos"></div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Categorías"></nav>
    <main id="grid" class="grid"></main>

    <nav class="bottom" aria-label="Menú">
      <button id="nav-phrases" type="button"><span aria-hidden="true">⭐</span>Frases</button>
      <button id="nav-listen" type="button"><span aria-hidden="true">👂</span>Escuchar</button>
      <button id="nav-games" type="button"><span aria-hidden="true">🎮</span>Juegos</button>
      <button id="nav-maestro" type="button"><span aria-hidden="true">🤖</span>Maestro</button>
      <button id="nav-admin" type="button"><span aria-hidden="true">🔒</span>Padres</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/games.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
